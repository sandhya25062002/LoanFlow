databases:
  - name: loanflow-db
    plan: free
    databaseName: loanflow
    user: loanflow

services:
  - type: web
    name: loanflow
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn loanflow.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: loanflow-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: WEB_CONCURRENCY
        value: "4"
